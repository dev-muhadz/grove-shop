<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Grove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .cart-page-grid { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-7); align-items: start; }
  .cart-page-lines { background: var(--color-surface); }
  @media (max-width: 860px) { .cart-page-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container site-header__inner">
    <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="brand"><span class="brand__mark">◆</span> Grove</a>
    <nav class="nav-primary" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
    </nav>
    <div class="header-actions">
      <div class="theme-switch" role="group" aria-label="Choose a theme">
        <button data-swatch="light" aria-label="Light theme"></button>
        <button data-swatch="dark" aria-label="Dark theme"></button>
        <button data-swatch="neo" aria-label="Neo theme"></button>
      </div>
      <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M12 21s-7.5-4.9-10-9.3C.3 8 2 4 6 4c2.2 0 3.7 1.3 6 4 2.3-2.7 3.8-4 6-4 4 0 5.7 4 4 7.7-2.5 4.4-10 9.3-10 9.3z"/></svg>
        <span class="badge-count" data-wishlist-count>0</span>
      </a>
      <button class="icon-btn" data-cart-open aria-label="Open cart">
        <svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="badge-count" data-cart-count>0</span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="container section--tight">
  <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Cart</span></nav>
  <h1 style="font-size:var(--fs-2xl)">Your cart</h1>

  <div class="cart-page-grid">
    <div class="cart-page-lines" data-cart-body></div>
    <div class="order-review" data-cart-footer></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Grove. Template for demonstration purposes.</span>
      <span>Built with vanilla HTML, CSS &amp; JS</span>
    </div>
  </div>
</footer>

<div class="drawer-overlay" data-mobile-nav-overlay></div>
<nav class="mobile-nav" id="mobile-nav" data-mobile-nav aria-label="Mobile">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span class="brand"><span class="brand__mark">◆</span> Grove</span>
    <button class="icon-btn" data-mobile-nav-close aria-label="Close menu">✕</button>
  </div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="wishlist.html">Wishlist</a></li>
  </ul>
</nav>

<div class="drawer-overlay" data-cart-overlay></div>
<aside class="drawer" data-cart-drawer role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title" aria-hidden="true">
  <div class="drawer__header">
    <h3 id="cart-drawer-title">Your cart</h3>
    <button class="icon-btn" data-cart-close aria-label="Close cart">✕</button>
  </div>
  <div class="drawer__body" data-cart-body></div>
  <div class="drawer__footer" data-cart-footer></div>
</aside>

<script type="module" src="js/mockData.js"></script>
<script type="module" src="js/cart.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
